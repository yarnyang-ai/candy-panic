name: Deploy Candy Panic to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Test game rules
        run: npm test
      - uses: actions/configure-pages@v6
      - name: Prepare game files
        run: |
          mkdir -p _site/src _site/assets/characters
          cp index.html styles.css favicon.svg .nojekyll _site/
          cp src/*.js _site/src/
          cp assets/characters/*.png _site/assets/characters/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
